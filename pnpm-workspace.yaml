packages:
  - "meadow"

# npm は pre<script> / post<script> を自動実行するが、pnpm は既定でしない。
# このリポジトリは `prep` (OpenAPI 生成 + version 埋め込み) を prebuild /
# prebuild:examples / pretest / pretest:all / prelint:source の 5 か所から
# 暗黙に呼んでおり、そのどれが欠けても生成物なしでビルドが走る。5 つの script を
# 書き換えて明示するより、npm と同じ意味論を保つほうが差分も事故も小さい。
enablePrePostScripts: true

# pnpm 11 は依存の lifecycle script を既定で実行しない。走らせてよいものだけを
# 明示する。この 3 つは `pnpm install` に列挙させた実測値で、増やす前には
# 「なぜビルドが要るのか」を確かめること。
#
#   esbuild        — vitest 経由。platform 別の binary を postinstall で用意する
#   puppeteer      — install.mjs。.puppeteerrc.json の skipDownload: true が効くので
#                    Chromium のダウンロードは走らない ("Skipping downloading browsers")
#   unrs-resolver  — eslint-plugin-import-x が使う Rust 実装の path resolver。
#                    native bindings の link が要る
allowBuilds:
  esbuild: true
  puppeteer: true
  unrs-resolver: true

# npm の `overrides` の移設先。pnpm 11 は package.json の `pnpm.overrides` を
# 読まなくなり、書いても [WARN] を出して無視する（＝脆弱性修正が黙って失われる）。
# `$rimraf` はルートの rimraf と同じ版に合わせる参照で、npm の入れ子記法
# {"pkg": {"dep": …}} は pnpm では "pkg>dep" と平坦に書く。
overrides:
  brace-expansion: "^5.0.8"
  js-yaml: "^4.3.0"
  puppeteer-extra-plugin-user-data-dir>rimraf: "$rimraf"
