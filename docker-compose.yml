# BrowserHive stack on Apple Container, driven by container-compose
# (https://github.com/Mcrich23/Container-Compose — installed via Homebrew).
#
#   container-compose up -d -b                     # 1 worker
#   container-compose --profile scale2 up -d -b    # 2 workers
#   container-compose --profile scale3 up -d -b    # 3 workers
#   container-compose --profile meadow up -d -b    # + meadow (fixture origin)
#   container-compose down                         # stop everything
#
# One-time machine setup (also required on a CI runner):
#   sudo container system dns create browserhive
# The project-named DNS domain switches container-compose into its real-DNS
# mode: containers are named <service>.browserhive, registered with the
# platform DNS, and resolvable from other containers AND from the host.
# Do NOT add container_name: keys — they suppress the DNS naming and drop
# the stack back to /etc/hosts patching, which silently fails for the
# non-root containers here (browserhive, chromium).
#
# Readiness is deliberately NOT handled here (container-compose has no
# healthcheck support): the S3 bucket init runs inside seaweedfs's
# entrypoint, the E2E globalSetup retries until /v1/status answers, and
# humans use the curl wait loop in the docs.
#
# BROWSERHIVE_BROWSER_URLS lists all three workers, but the pool is the
# DNS-resolved subset: browserhive excludes hosts that are not running
# (NXDOMAIN) at startup and reconciles workers that appear/disappear later,
# with no restart. See docs (production environment / architecture).

# Pin the project name. container-compose derives it from the directory name
# otherwise, and the project name IS the DNS domain here: it must equal the
# `container system dns create <name>` domain and the hard-coded
# `<service>.browserhive` hostnames below. Fixing it decouples the stack from
# the checkout directory name (a mismatch silently falls back to /etc/hosts,
# which fails for the non-root containers).
name: browserhive

services:
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.23
    # The entrypoint also creates the bucket (background retry loop) —
    # there is no separate one-shot init container to order around.
    entrypoint: ["/etc/seaweedfs/entrypoint.sh"]
    # Read path for the E2E suite only. browserhive itself keeps writing over
    # the platform DNS name (seaweedfs.browserhive:8333) — this publishes the
    # same S3 port to the host so tests can fetch back what a capture stored.
    # Bound to 127.0.0.1: the bundled identity is a fixed dev credential.
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      - BROWSERHIVE_S3_BUCKET=browserhive
    volumes:
      - ./etc/seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data

  # Workers: 1-3. Default = chromium-1 only; scale2 adds one, scale3 adds
  # two (chromium-2 belongs to both profiles, so one flag always suffices).
  chromium-1: &worker
    build:
      context: ./chromium-server-docker
      dockerfile: docker/Dockerfile
      target: production
    # cpus: is ignored by container-compose 1.1.0; the default (4 CPUs)
    # happens to match what bin/prod.sh used to pass explicitly.
    mem_limit: 4gb
  chromium-2:
    <<: *worker
    profiles: ["scale2", "scale3"]
  chromium-3:
    <<: *worker
    profiles: ["scale3"]

  browserhive:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # Bake the git revision and release tag into /v1/status.build. Pass them
        # when building:
        #   GIT_REV=$(git rev-parse --short HEAD) GIT_TAG=$(git describe --tags) \
        #     container-compose up -d -b
        # GIT_REV defaults to "dev"; an empty GIT_TAG falls back to package.json.
        GIT_REV: "${GIT_REV:-dev}"
        GIT_TAG: "${GIT_TAG:-}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Name-based wiring via the platform DNS (<service>.browserhive) —
      # no IP collection anywhere. All three workers are always listed;
      # ones a scale profile did not start stay in active.degraded.
      - BROWSERHIVE_BROWSER_URLS=http://chromium-1.browserhive:9222,http://chromium-2.browserhive:9222,http://chromium-3.browserhive:9222
      - BROWSERHIVE_S3_ENDPOINT=http://seaweedfs.browserhive:8333
      - BROWSERHIVE_S3_REGION=us-east-1
      - BROWSERHIVE_S3_BUCKET=browserhive
      - BROWSERHIVE_S3_ACCESS_KEY_ID=browserhive
      - BROWSERHIVE_S3_SECRET_ACCESS_KEY=browserhive
      - BROWSERHIVE_S3_FORCE_PATH_STYLE=true
      # Accept client-supplied behaviors.custom (the example client attaches
      # per-host custom behaviors from examples/behaviors/<version>/). Dev stack
      # only — the server is published on 127.0.0.1.
      - BROWSERHIVE_ALLOW_CUSTOM_BEHAVIORS=true
      # Where `signing: true` captures go for their signature. The service only
      # runs under the "signing" profile; without it every such capture comes
      # back `signature.signed: false` and the WACZ is written unsigned, which
      # is the documented behaviour rather than a failure.
      - BROWSERHIVE_SIGNING_URL=http://capping.browserhive:8080/sign
      - BROWSERHIVE_SIGNING_TOKEN=dev-token
      # Without these two the chain and timestamp checks report `skipped`, and
      # dev would exercise half of what production runs. They point at the same
      # identity capping signs with below — the point being that a signature
      # from any *other* CA is then rejected here too, which is how a
      # production server refuses the dev CA.
      - BROWSERHIVE_SIGNING_TRUST_ANCHOR=/dev-ca/insecure-dev-ca.crt
      - BROWSERHIVE_SIGNING_TIMESTAMP_ANCHOR=/dev-ca/insecure-dev-tsa-ca.crt
      - LOG_LEVEL=info
      # The entrypoint shim polls this URL before starting the server —
      # depends_on is start order only, and the boot HeadBucket is fatal.
      - WAIT_FOR_S3=http://seaweedfs.browserhive:8333
      # The platform DNS publishes AAAA records too, but there is no v6
      # route between the VMs — resolve v4 first or worker WS URLs land on
      # unreachable v6 addresses.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      # The two anchors above name paths inside this container, so the identity
      # capping signs with has to be readable from here as well. Without the
      # mount the anchors resolve to nothing, `readTrustAnchors` returns empty,
      # and the chain and timestamp checks report `skipped` — which is exactly
      # the half-verified state setting them was meant to end.
      - ./test/fixtures/dev-ca:/dev-ca:ro
    depends_on:
      - seaweedfs
      - chromium-1

  # Local wacz-auth signing. Stands in for the service that would sign captures
  # in production, so the HTTP path — token, timeout, service being down — is
  # exercised here rather than discovered later.
  #
  # The identity is mounted read-only from test/fixtures/dev-ca. Committing it
  # is the point: every environment gets the same ca.crt, which is what lets a
  # test assert `capping verify --root test/fixtures/dev-ca/insecure-dev-ca.crt`
  # instead of
  # merely "a signature appeared". Those keys sign nothing anyone trusts — the
  # CA reaches no trust store.
  capping:
    build:
      context: ./capping
    # --host 0.0.0.0 because capping's default is 127.0.0.1, which no other
    # container can reach.
    command:
      ["serve", "--dir", "/id", "--host", "0.0.0.0", "--port", "8080",
       "--token", "dev-token"]
    volumes:
      - ./test/fixtures/dev-ca:/id:ro
    profiles: ["signing"]

  # E2E fixture-origin ("the synthetic internet"). One URL serves both
  # directions: Chromium visits http://meadow.browserhive:8080 via the
  # platform DNS, and the host-side test process resolves the SAME name
  # for /__reset and /__hits — no port publishing needed.
  meadow:
    build:
      context: ./meadow
      args:
        # Baked into meadow's /__version, which the E2E setup compares against
        # the submodule before running anything. Evaluated inside the submodule,
        # hence -C. Use `pnpm run stack:up` rather than passing these by hand.
        GIT_TAG: "${MEADOW_TAG:-}"
        GIT_REV: "${MEADOW_REV:-dev}"
    profiles: ["meadow"]

volumes:
  seaweedfs-data:
