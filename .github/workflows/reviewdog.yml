name: reviewdog
on:
  pull_request:
    branches: [main, develop]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # meadow must be on disk for the type-aware rules — see the build step
      # below. Without this its directory is empty, `pnpm --filter meadow build`
      # matches no project and exits 0, and the failure only shows up as
      # `scenarios` resolving to `any`. Same setting as ci.yml.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # reviewdog invokes eslint directly, so the `prelint:source` hook never
      # fires — everything it does has to be reproduced here. It runs `prep`
      # (the three generate steps below) *and* builds meadow, whose emitted types
      # the type-aware rules need: without `meadow/dist/index.d.ts` the E2E
      # tests' `scenarios` import resolves to `any` and every use of it trips
      # no-unsafe-member-access / restrict-plus-operands. Locally this passes
      # regardless, because a previous build left dist/ in place.
      #
      # Note this step cannot report its own failure: `pnpm --filter` exits 0
      # when nothing matches, so a missing submodule makes it a silent no-op.
      - run: pnpm run openapi:generate
      - run: pnpm run openapi:gen-operations
      # The other half of `prep`. Missing here until a rule finally noticed:
      # `src/generated/version.ts` is generated and git-ignored, so on a fresh
      # checkout `BUILD_INFO` has no resolvable type and every property read of
      # it trips no-unsafe-member-access. Nothing read a property of it until
      # `SOFTWARE_IDENTIFIER` did, which is why this was invisible.
      - run: pnpm run generate:version
      - run: pnpm --filter meadow build
      # reviewdog がコメントを投稿するトークンを GitHub App から実行ごとに発行する。
      # 保管する秘密は App の秘密鍵(REVIEWDOG_APP_KEY)だけで、これは無期限。
      # Dependabot PR でも動くよう、この鍵は Actions/Dependabot の両 secret store に登録する。
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: 4355270
          private-key: ${{ secrets.REVIEWDOG_APP_KEY }}
      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          reporter: github-pr-review
          eslint_flags: '. --max-warnings 0'
          fail_level: warning
