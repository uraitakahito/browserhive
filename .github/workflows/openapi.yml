name: openapi
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/http/openapi.yaml'
      - 'redocly.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/openapi.yml'

jobs:
  lint:
    name: Redocly lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx redocly lint --format=github-actions
