name: ci

# Fast per-PR gate for the checks that were previously only run locally:
# the production build (which now also type-checks the esbuild-bundled behavior
# runtime via build:behaviors -> typecheck:behaviors), the examples build (whose
# separate tsconfig is where a forgotten `exclude` for browser-only code would
# surface), ESLint, and the unit tests. The heavier black-box e2e suite stays on
# manual dispatch (see e2e.yml); ESLint annotations stay on reviewdog.yml.
#
# GitHub-hosted Linux, no submodules: none of these steps need the `meadow`
# submodule (only test/e2e imports it, and `npm test` runs the unit project) —
# the same install pattern reviewdog.yml relies on.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, examples, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # `build` runs prep (openapi:generate + generate:version), tsc, then
      # build:behaviors (typecheck:behaviors + esbuild) — so the browser runtime
      # is type-checked here.
      - run: npm run build
      # Guards the tsconfig.examples.json exclude: a browser-only file leaking
      # into tsc fails here.
      - run: npm run build:examples
      - run: npm run lint:source
      - run: npm test
