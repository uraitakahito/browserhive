name: e2e

# Full black-box E2E: brings up the real stack (meadow + chromium-server-docker +
# seaweedfs + browserhive) on Apple Container and runs the `e2e` Vitest project
# against it — exactly what a client sees. Kept OFF the per-PR path (the fast unit
# CI covers every PR). Manual dispatch only: with no self-hosted runner registered,
# the former nightly schedule just queued for 24 h and auto-cancelled every night.
#
# Runner prerequisites (self-hosted macOS 26, Apple silicon):
#   - the `container` CLI (Apple Container does not run on GitHub-hosted Linux)
#   - `brew install container-compose`
#   - one-time: `sudo container system dns create browserhive` (the project-named
#     DNS domain that makes <service>.browserhive names resolve — see
#     docker-compose.yml)
# For a Linux/GitHub-hosted E2E, port the same `test:e2e` suite to
# testcontainers (out of scope here).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Black-box E2E (real stack)
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # meadow is a workspace member (`workspace:*`), so install only links it.
      # Its dist/ is built explicitly by `test:e2e` — it used to ride along on
      # `npm ci` via a `prepare` script, which pnpm would also have run during
      # the image build, where meadow's sources are not present.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # capping is a submodule and its dist/ is what test/e2e/signing.e2e.test.ts
      # spawns to verify a signature — the only thing that checks the signature
      # itself, as opposed to checking that a digest file appeared.
      - name: Build capping
        run: pnpm --dir capping install --frozen-lockfile && pnpm --dir capping run build

      # `pnpm run stack:up` rather than container-compose directly. The script
      # passes MEADOW_TAG and MEADOW_REV, which the compose file defaults to
      # `dev` without — and `dev` is exactly what test/e2e/global-setup.ts
      # refuses to start on, since it means the image cannot be checked for
      # staleness. Spelling the command out here got that wrong: this job could
      # not have reached a single test.
      #
      # The script brings up both profiles. `signing` is the local wacz-auth
      # service; without it every signed capture comes back
      # `signature.signed: false`, which is correct behaviour and a failing
      # signing suite — the archive is still written, so nothing else would go
      # red.
      - name: Bring up the stack
        run: pnpm run stack:up

      # Produces the @vitest/ui HTML report into html-e2e/ instead of only
      # printing to the log. The suite annotates every capture with its taskId,
      # status and artifact locations (see test/e2e/helpers/capture.ts); the UI
      # renders those as a Test Annotations panel and inlines them in the Code
      # tab, which is the whole point of keeping the report.
      #
      # continue-on-error so a red suite still reaches the upload below — a
      # failed report is the one worth reading. The failure is re-raised by
      # "Verify E2E outcome" after the artifact is safely stored.
      - name: Run E2E (readiness handled by the suite's globalSetup retry)
        id: e2e
        continue-on-error: true
        run: pnpm run test:report:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: html-e2e
          # The report is a Vite app: it fetches html.meta.json.gz at runtime and
          # does not work over file://. After downloading, serve it:
          #   npx vite preview --outDir e2e-report
          if-no-files-found: error

      # Turns the swallowed failure back into a red run. Kept separate from the
      # run step so the artifact upload above always gets a chance to happen.
      - name: Verify E2E outcome
        if: steps.e2e.outcome != 'success'
        run: exit 1

      - name: Tear down
        if: always()
        # `down` only covers services active under the given profiles, so this
        # has to name the same set as the up — which is why both live in
        # package.json rather than here.
        run: pnpm run stack:down
